spring:
  application:
    name: ticket-booking-system
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 30000
  flyway:
    enabled: true
    # Migrations run as the schema owner; the app itself connects as a DML-only role.
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    servlet:
      path: /tbs

app:
  metrics:
    seat-gauge-window: ${SEAT_GAUGE_WINDOW:PT24H}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ticket-booking-system
    ttl: ${JWT_TTL:PT12H}

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,database
  health:
    # Replaced by the "database" indicator, which uses its own pool with short timeouts.
    db:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
