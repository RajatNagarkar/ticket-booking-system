spring:
  application:
    name: ticket-booking-system
  threads:
    virtual:
      enabled: true
  datasource:
    # POSTGRES_DB_URL wins if set; otherwise built from the PG* variables a Railway Postgres
    # reference provides (private network, so no TLS parameters).
    url: ${POSTGRES_DB_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fixed-size pool. Requests beyond it queue for up to connection-timeout instead of failing.
      maximum-pool-size: ${DB_POOL_SIZE:40}
      minimum-idle: ${DB_POOL_SIZE:40}
      connection-timeout: 30000
  flyway:
    enabled: true
    # Migrations run as the schema owner; the app itself connects as a DML-only role.
    # FLYWAY_* win if set; otherwise the database owner from the PG* variables.
    user: ${PGUSER}
    password: ${PGPASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    # Used by the beforeMigrate callback to create the application role (brackets keep the "_").
    placeholders:
      "[app_user]": ${DB_USERNAME:}
      "[app_password]": ${DB_PASSWORD:}
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    servlet:
      path: /tbs

app:
  metrics:
    seat-gauge-window: ${SEAT_GAUGE_WINDOW:PT24H}
    # Basic auth for /internal/metrics (Grafana Cloud scrape). Unset password: endpoint always 401.
    scrape:
      user: ${METRICS_USER:grafana}
      password: ${METRICS_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ticket-booking-system
    ttl: ${JWT_TTL:PT12H}

server:
  # Hosting platforms inject PORT; 8085 locally.
  port: ${PORT:8085}
  shutdown: graceful
  tomcat:
    # Request handling runs on virtual threads, so connections are cheap. The defaults (8192
    # connections, 100 queued) would refuse part of an on-sale stampede; refused connections
    # surface as proxy 502s. Requests beyond the DB pool queue for a connection instead.
    max-connections: 20000
    accept-count: 2000

info:
  app:
    commit: ${APP_COMMIT:unknown}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,database
  health:
    # Replaced by the "database" indicator, which uses its own pool with short timeouts.
    db:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
