name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit and integration tests; Testcontainers uses the runner's Docker daemon.
      - name: Test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  container:
    name: Docker image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same path a reviewer takes from a clean clone: build the image, start the stack, hit the API.
      - name: Start stack
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test
        run: ./scripts/smoke.sh http://localhost:8085/tbs

      # A reduced stampede on every change: same scenarios and checks as the full burst.
      - name: Burst
        run: ./burst.sh http://localhost:8085/tbs --concurrency 500 --random 4000

      - name: Show app logs
        if: always()
        run: docker compose logs app

      - name: Stop stack
        if: always()
        run: docker compose down --volumes
